name: Release CloudPDF Runtime Libraries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: embedpdf/main
      release:
        description: Publish GitHub release
        type: boolean
        required: false
        default: false
      upstream_gate_override_reason:
        description: >-
          Publish while missing upstream PDFium commits older than 2 days: why.
          The release notes list them; likely security fixes must be cherry-picked
          (docs/embedpdf/upstream-sync.md)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # The release gates (docs/embedpdf/upstream-sync.md, "Release gates").
  upstream-gate:
    name: Upstream freshness and fork tags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Fetch upstream PDFium
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags https://pdfium.googlesource.com/pdfium main:refs/remotes/upstream/main; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          exit 1

      # Enforced only when publishing: sync branches are behind upstream on
      # purpose until they merge.
      - name: Check upstream freshness
        shell: bash
        env:
          ENFORCE: ${{ inputs.release == true }}
          OVERRIDE_REASON: ${{ inputs.upstream_gate_override_reason }}
        run: |
          mkdir -p out/upstream-gate
          args=(--notes out/upstream-gate/notes.md --json out/upstream-gate/upstream.json)
          if [[ "$ENFORCE" == true ]]; then
            args+=(--enforce)
          fi
          python3 scripts/embedpdf-runtime/check-upstream-freshness.py "${args[@]}" \
            --override-reason "$OVERRIDE_REASON"

      - name: Check fork tags
        shell: bash
        run: python3 scripts/embedpdf-runtime/check-fork-tags.py --strict

      - uses: actions/upload-artifact@v6
        with:
          name: upstream-gate
          path: out/upstream-gate/

  tsan-soak:
    name: ThreadSanitizer soak
    needs: upstream-gate
    uses: ./.github/workflows/pdfium-tsan-thread-soak.yml
    with:
      ref: ${{ inputs.ref || github.ref_name }}

  source-tests:
    name: Source tests (Linux x64)
    needs: upstream-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Install depot_tools
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Install Linux base deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang lld curl g++ pkg-config tar

      - name: Install independent save checker
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/save-check"
          "$RUNNER_TEMP/save-check/bin/python" -m pip install -r testing/tools/requirements-save-check.txt
          echo "EPDF_SAVE_CHECK_PYTHON=$RUNNER_TEMP/save-check/bin/python" >> "$GITHUB_ENV"

      - name: Run PDFium unit and embedder tests
        shell: bash
        run: scripts/embedpdf-runtime/test-target.sh linux-x64

      - name: Run embedder tests in layer mode
        shell: bash
        run: |
          python3 testing/tools/run_layer_mode.py out/embedpdf-runtime-tests-linux-x64 \
            --out out/embedpdf-runtime-test-results/linux-x64/layer-mode

      - name: Upload PDFium test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pdfium-source-test-results-linux-x64
          path: out/embedpdf-runtime-test-results/linux-x64/
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.target }}
    needs: source-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,        runner: ubuntu-24.04 }
          - { target: linux-arm64,      runner: ubuntu-24.04 }
          - { target: linuxmusl-x64,    runner: ubuntu-24.04 }
          - { target: linuxmusl-arm64,  runner: ubuntu-24.04 }
          - { target: wasm32,           runner: ubuntu-24.04 }
          - { target: darwin-arm64,     runner: macos-15 }
          - { target: darwin-x64,       runner: macos-15 }
          - { target: win32-x64,        runner: windows-2022 }
          - { target: win32-arm64,      runner: windows-2022 }
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
      EMSDK_VERSION: 3.1.72
      MUSL_URLS: ${{ secrets.MUSL_URL || 'https://more.musl.cc https://musl.cc' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}
      - name: Install depot_tools
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
      - name: Install Linux base deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake curl g++ pkg-config tar
      - name: Install aarch64 cross-compiler
        if: matrix.target == 'linux-arm64'
        shell: bash
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Install musl toolchain
        if: startsWith(matrix.target, 'linuxmusl-')
        shell: bash
        run: |
          triple=x86_64-linux-musl
          if [[ "${{ matrix.target }}" == "linuxmusl-arm64" ]]; then
            triple=aarch64-linux-musl
          fi
          archive="$triple-cross.tgz"

          for base_url in $MUSL_URLS; do
            url="$base_url/$archive"
            if [[ "$base_url" == *"more.musl.cc"* ]]; then
              url="$base_url/$triple/$archive"
            fi

            echo "Downloading $url"
            if curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 -o "$archive" "$url"; then
              tar xzf "$archive"
              echo "$PWD/$triple-cross/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done

          echo "Failed to download musl toolchain for $triple" >&2
          exit 1
      - name: Install Emscripten
        if: matrix.target == 'wasm32'
        shell: bash
        env:
          DEPOT_TOOLS_PYTHON_BYPASS: '1'
        run: |
          mkdir -p third_party
          if [[ -d third_party/emsdk ]]; then
            git -C third_party/emsdk pull
          else
            git clone https://github.com/emscripten-core/emsdk.git third_party/emsdk
          fi
          third_party/emsdk/emsdk install "$EMSDK_VERSION"
          third_party/emsdk/emsdk activate "$EMSDK_VERSION"
          echo "$PWD/third_party/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$PWD/third_party/emsdk/upstream/bin" >> "$GITHUB_PATH"
      - name: Select Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: sudo xcode-select -s "/Applications/Xcode_26.0.app"
      - name: Install Windows deps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $kitsRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $sdk = Get-ChildItem $kitsRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $sdk) {
            throw "No Windows SDK version directory found in $kitsRoot"
          }
          $rcPath = Join-Path $sdk.FullName 'x64'
          if (!(Test-Path (Join-Path $rcPath 'rc.exe'))) {
            throw "rc.exe not found in $rcPath"
          }
          $rcPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # build/ pins a Windows SDK the runner may not have; build with the
          # newest one it does have (patches/embedpdf-runtime/win/build.patch).
          "EMBEDPDF_WIN_SDK_VERSION=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build target
        shell: bash
        run: scripts/embedpdf-runtime/build-target.sh "${{ matrix.target }}"
      # The native server runs this target on several threads in one process.
      - name: Check writable globals
        if: matrix.target == 'linux-x64'
        shell: bash
        run: python3 scripts/embedpdf-runtime/check-globals.py out/embedpdf-runtime/linux-x64/libembedpdf.so
      - name: Package target
        shell: bash
        run: scripts/embedpdf-runtime/package-target.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: libembedpdf-runtime-${{ matrix.target }}
          path: out/embedpdf-runtime-artifacts/*.tar.gz

  release:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [upstream-gate, tsan-soak, source-tests, build]
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p out/embedpdf-runtime-artifacts
          find artifacts -name '*.tar.gz' -exec cp {} out/embedpdf-runtime-artifacts/ \;
      # The built ref's commit, which can differ from the commit the workflow
      # was dispatched from.
      - name: Name the release
        id: name
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Write manifest
        shell: bash
        run: |
          tag="runtime-${{ steps.name.outputs.sha }}"
          export PDF_RUNTIME_ARTIFACT_DIR="$PWD/out/embedpdf-runtime-artifacts"
          export PDF_RUNTIME_RELEASE_BASE_URL="https://github.com/${{ github.repository }}/releases/download/$tag"
          export PDF_RUNTIME_UPSTREAM_FILE="$PWD/artifacts/upstream-gate/upstream.json"
          scripts/embedpdf-runtime/write-manifest.sh "$PDF_RUNTIME_ARTIFACT_DIR/pdf-runtime-build.generated.json"
      - uses: ncipollo/release-action@v1
        with:
          tag: runtime-${{ steps.name.outputs.sha }}
          name: EmbedPDF PDF Runtime ${{ steps.name.outputs.sha }}
          bodyFile: artifacts/upstream-gate/notes.md
          artifacts: out/embedpdf-runtime-artifacts/*
          allowUpdates: true
